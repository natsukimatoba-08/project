<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | ApplyFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul class="navbar">
        <li class="brand"><a class="ApplyFlow">🔎Apply<span class="flow">Flow</span></a></li>
        <li class="menu">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </li>

    <section class="login">
        <div class="login-container">
            <div class="loginform">
                <h2>Reset Password</h2>
                <p style="color: #64748b; margin-bottom: 20px;">Enter your email and we'll send you a link to get back into your account.</p>

                    <input type="email" placeholder="Enter your email" required />
                    <button type="submit">Send Reset Link</button>
                </form>
                <p class="gotosignup" style="margin-top: 20px;">
                    <a href="login.html">← Back to Login</a>
                </p>
            </div>
        </div>
    </section>
